spack:
  view: false

  include:
  - ../../.ci/gitlab/

  packages:
    all:
      require:
      - target=x86_64_v3
      - ~cuda
      - ~rocm
      prefer:
        - "%gcc"
  concretizer:
    unify: true
    reuse: false
    static_analysis: true

  specs:
  # spack developer tools
  # pinned to versions CI uses
  - group: rust
    specs:
    - rust@1.95:
  - group: dev-rust
    needs: [rust]
    specs:
    - py-ruff@0.16.0 ^python@3.10
    - py-ruff@0.16.0 ^python@3.14
    - py-ty@0.0.72 ^python@3.10
    - py-ty@0.0.72 ^python@3.14
  - group: dev-python
    specs:
    - py-pytest@9.0.3

  ci:
    pipeline-gen:
    - build-job:
        image: ghcr.io/spack/aarch64-linux-gnu:v2024-12-18

  cdash:
    build-group: Spack Development Tools aarch64-linux-gnu
