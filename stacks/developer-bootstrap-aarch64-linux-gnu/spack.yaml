spack:
  view: false

  include:
  - ../../.ci/gitlab/

  packages:
    all:
      require:
      - target=x86_64_v3
      - ~cuda
      - ~rocm
      prefer:
        - "%gcc"
  concretizer:
    unify: true
    reuse: false
    static_analysis: true

  specs:
  # spack developer tools
  # pinned to versions CI uses
  - py-pytest@9.0.3
  - py-ruff@0.15.0
  - py-ty@0.0.72

  ci:
    pipeline-gen:
    - build-job:
        image: ghcr.io/spack/aarch64-linux-gnu:v2024-12-18

  cdash:
    build-group: Spack Development Tools aarch64-linux-gnu
