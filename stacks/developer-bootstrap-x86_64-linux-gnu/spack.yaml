spack:
  view: false

  include:
  - ../../.ci/gitlab/

  packages:
    all:
      require:
      - target=x86_64_v3
      - ~cuda
      - ~rocm
      prefer:
        - "%gcc"
  concretizer:
    unify: true
    reuse: false
    static_analysis: true

  specs:
  - py-pytest@9.0.3
  - py-ruff@0.15.0
  - py-ty@0.0.20

  ci:
    pipeline-gen:
    - build-job:
        image: ghcr.io/spack/x86_64_v3-linux-gnu:2024-12-12

  cdash:
    build-group: Spack Development Tools x86_64_v3-linux-gnu
